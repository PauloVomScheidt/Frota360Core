name: CI

# Sem filtro de path de propósito: `on.<evento>.paths` impede o workflow de rodar, e um
# required check que nunca reporta trava o PR em "Expected — Waiting for status" para sempre.
# Se um dia valer a pena pular jobs, use um job de detecção + `if:` nos jobs de baixo — job
# pulado por `if:` conta como satisfeito no branch protection; workflow que não roda, não.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Só em PR: um push na main valida o commit já mergeado e não deve ser cancelado.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # O id do job é o nome do check no branch protection — `api`, `web` e `docker`.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # Cache à mão em vez de `cache: true` do setup-dotnet: aquele exige packages.lock.json,
      # que o repositório não usa.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/api/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore Frota360.slnx

      - run: dotnet build Frota360.slnx -c Release --no-restore

      # O coverlet.runsettings gera OpenCover (lido pelo SonarCloud) e tira as migrations da conta.
      - name: Testes unitários
        run: dotnet test tests/Frota360.Tests/Frota360.Tests.csproj -c Release --no-build --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults

      # Separado dos unitários para o log dizer de imediato se quebrou lógica ou banco.
      # Sobe um postgres:17 descartável via Testcontainers (ver BancoFixture) — por isso não
      # há bloco `services:` aqui: o container é gerenciado pelo próprio teste.
      - name: Testes de integração (Testcontainers)
        run: dotnet test tests/Frota360.IntegrationTests/Frota360.IntegrationTests.csproj -c Release --no-build --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults

      # Controllers e middlewares, sem subir a aplicação: a camada que as outras duas suítes não alcançam.
      - name: Testes da camada Api
        run: dotnet test tests/Frota360.Api.Tests/Frota360.Api.Tests.csproj -c Release --no-build --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura-api
          path: apps/api/TestResults/**/coverage.opencover.xml
          if-no-files-found: error
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # --ignore-scripts: nenhuma dependência precisa de script de instalação no Linux (o único
      # que existe é o do fsevents, exclusivo do macOS), e assim um pacote comprometido não roda nada no CI.
      - run: npm ci --ignore-scripts

      # Já é `tsc -b && vite build`. O vite build roda em mode=production e lê o
      # .env.production, que é versionado — VITE_API_URL não precisa vir do workflow.
      - name: Build (tsc + vite)
        run: npm run build

      # `always()` para o PR mostrar tsc e lint no mesmo run, em vez de um por vez.
      - name: Lint
        if: always()
        run: npm run lint

      - name: Testes (Vitest + cobertura)
        if: always()
        run: npm run test:cov

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura-web
          path: apps/web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  # Análise estática no SonarCloud, projeto único para o monorepo: o SonarScanner for .NET analisa o
  # C# pelo build e, com `sonar.scanner.scanAll` (padrão), também o TypeScript, o YAML e o Dockerfile.
  # Não é required check e o quality gate não reprova o CI: o status aparece no PR pelo próprio Sonar.
  sonar:
    needs: [api, web]
    # PR de fork e do Dependabot não recebem o SONAR_TOKEN.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Histórico completo: o Sonar usa o blame para separar código novo do antigo.
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/api/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Fora do workspace para os relatórios não entrarem na análise. Os caminhos dentro deles
      # batem com este checkout: o OpenCover grava absoluto (mesmo diretório em todo runner) e o
      # lcov sai relativo à raiz do repositório (projectRoot no vite.config.ts).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cobertura-api
          path: ${{ runner.temp }}/cobertura/api

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cobertura-web
          path: ${{ runner.temp }}/cobertura/web

      - run: dotnet tool install --global dotnet-sonarscanner --version 12.1.0

      - name: Início da análise
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"PauloVomScheidt_Frota360Core"
          /o:"paulovomscheidt"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.projectBaseDir="$GITHUB_WORKSPACE"
          /d:sonar.cs.opencover.reportsPaths="$RUNNER_TEMP/cobertura/api/*/coverage.opencover.xml"
          /d:sonar.javascript.lcov.reportPaths="$RUNNER_TEMP/cobertura/web/lcov.info"
          /d:sonar.exclusions="apps/api/src/Infrastructure/Migrations/**,apps/web/src/api/schema.d.ts,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx,apps/web/src/test/**"
          /d:sonar.coverage.exclusions="apps/api/src/Api/Program.cs,apps/web/src/main.tsx,apps/web/src/vite-env.d.ts,apps/web/*.config.ts,scripts/**"

      - name: Build
        run: dotnet build apps/api/Frota360.slnx -c Release

      - name: Fim da análise (envio ao SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  docker:
    runs-on: ubuntu-latest
    # O Dockerfile instala curl via apt-get, então o build depende de rede.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Num clone limpo, os arquivos que o .dockerignore exclui NÃO EXISTEM — buildar e
      # conferir que não estão na imagem não provaria nada. As iscas abaixo dão o que testar.
      - name: Plantar iscas para provar o .dockerignore
        run: |
          echo '{"ConnectionStrings":{"DefaultConnection":"SEGREDO_CANARIO_CI"}}' > apps/api/src/Api/appsettings.Development.json
          echo 'Jwt__Key=SEGREDO_CANARIO_CI' > apps/api/.env

      # Contexto é apps/api (os COPY do Dockerfile são relativos a essa pasta). Sem push:
      # o objetivo é pegar Dockerfile quebrado antes do deploy.
      - name: Build da imagem
        run: docker build -t frota360-api:ci apps/api

      - name: Conferir o que entrou na imagem
        run: |
          docker run --rm --entrypoint sh frota360-api:ci -c '
            set -e
            test ! -e /app/appsettings.Development.json || { echo "FALHA: appsettings.Development.json vazou para a imagem"; exit 1; }
            test ! -e /app/.env                         || { echo "FALHA: .env vazou para a imagem"; exit 1; }
            # O base é versionado e SOBE de propósito: sem ele Jwt:Issuer fica nulo e a
            # validação de token quebra em runtime.
            test -e /app/appsettings.json               || { echo "FALHA: appsettings.json base ausente da imagem"; exit 1; }
            test -e /app/Frota360.Api.dll               || { echo "FALHA: publish sem o assembly da API"; exit 1; }
            echo "OK: .dockerignore respeitado e publish íntegro."
          '
