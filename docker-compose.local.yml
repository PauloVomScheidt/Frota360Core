# Override do ensaio local da stack de produção.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml up -d --build
#
# Muda só o necessário para rodar sem domínio: troca o Caddyfile por um que serve HTTP puro
# em localhost. Tudo o mais — rede, ausência de portas publicadas, migrations no boot,
# ASPNETCORE_ENVIRONMENT=Production — permanece idêntico ao que vai para a EC2. É esse
# "idêntico" que faz o ensaio valer alguma coisa.

services:
  caddy:
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
